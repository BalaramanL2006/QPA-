<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details - Question Paper Analyzer</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bg-mesh {
            background: linear-gradient(135deg, #f8fafc 0%, #ffffff 50%, #eef2ff 100%);
            background-attachment: fixed;
        }

        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
        }

        .input-glass {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-glass:focus {
            background: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body class="bg-mesh min-h-screen flex items-center justify-center py-12 px-6">
    <!-- Background Accents -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-[10%] left-[5%] w-96 h-96 bg-indigo-600/5 rounded-full blur-[120px] animate-float">
        </div>
        <div class="absolute bottom-[10%] right-[5%] w-96 h-96 bg-purple-600/5 rounded-full blur-[120px] animate-float"
            style="animation-delay: -3s"></div>
    </div>

    <div class="w-full max-w-2xl relative z-10">
        <!-- Logo Header -->
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-600 to-purple-600 shadow-xl shadow-indigo-600/20 mb-6">
                <span class="text-white font-extrabold text-xl">QP</span>
            </div>
            <h1 class="text-4xl font-bold text-slate-900 tracking-tight mb-2">Details</h1>
            <p class="text-slate-500 font-medium">Set the subject parameters for optimized AI analysis</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-3xl p-8 md:p-12 shadow-xl border border-slate-100 relative overflow-hidden group">
            {% if error %}
            <div
                class="mb-8 p-4 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 text-sm flex items-center gap-3">
                <i class="fas fa-exclamation-triangle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-3">
                        <label for="staff_name" class="flex items-center gap-2 text-sm font-bold text-slate-700 ml-1">
                            <i class="fas fa-user-circle text-indigo-600"></i> Staff Name
                        </label>
                        <input type="text" id="staff_name" name="staff_name" required
                            class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                            placeholder="Prof. Jane Cooper">
                    </div>
                    <div class="space-y-3">
                        <label for="subject_code" class="flex items-center gap-2 text-sm font-bold text-slate-700 ml-1">
                            <i class="fas fa-barcode text-indigo-600"></i> Subject Code
                        </label>
                        <input type="text" id="subject_code" name="subject_code" required
                            class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                            placeholder="CS101">
                    </div>
                </div>

                <div class="space-y-3">
                    <label for="subject" class="flex items-center gap-2 text-sm font-bold text-slate-700 ml-1">
                        <i class="fas fa-book-bookmark text-indigo-600"></i> Subject Title
                    </label>
                    <input type="text" id="subject" name="subject" required
                        class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
                        placeholder="Advanced Data Structures">
                </div>

                <div class="space-y-3">
                    <label for="syllabus" class="flex items-center gap-2 text-sm font-bold text-slate-700 ml-1">
                        <i class="fas fa-list-check text-indigo-600"></i> Covered Topics
                    </label>
                    <textarea id="syllabus" name="syllabus" rows="4" required
                        class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all resize-none"
                        placeholder="e.g. Red-Black Trees, Graph Coloring, Dynamic Programming..."></textarea>
                </div>

                <div class="pt-8 flex items-center justify-center">
                    <button type="submit"
                        class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/20 transform hover:scale-[1.01] active:scale-[0.99] transition-all flex items-center justify-center gap-3">
                        <span class="text-lg">Go to Analysis</span>
                        <i class="fas fa-arrow-right text-sm"></i>
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center mt-12 text-slate-400 text-xs tracking-widest uppercase font-bold">
            &copy; 2026 Question Paper Analyzer &bull; Excellence
        </p>
    </div>
</body>

</html>
